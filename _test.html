<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어앱 새 주소 시험</title>
<style>
:root{--bg:#F7F6F3;--card:#fff;--ink:#1C2230;--ink2:#5E6676;--line:#E4E1DA;--sig:#FF6A2B;--ok:#138A55;--ok-bg:#E3F4EB;--no:#C8373C;--no-bg:#FBE7E8;--wait:#EFEDE8}
@media (prefers-color-scheme:dark){:root{--bg:#14171D;--card:#1D2129;--ink:#ECEEF2;--ink2:#A2A9B6;--line:#2E333D;--ok:#4CC88A;--ok-bg:#163327;--no:#F07075;--no-bg:#3A1C1F;--wait:#262A33;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}
p{margin:0;color:var(--ink2);font-size:14px}
.t{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.th{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.th small{display:block;color:var(--ink2);font-size:13px}
.chip{flex-shrink:0;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--wait);color:var(--ink2)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.no{background:var(--no-bg);color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border-radius:12px;padding:12px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.go{background:var(--sig);border-color:var(--sig);color:#fff;flex:1}
.out{font-size:14px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.out:empty{display:none}
.yt{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--wait)}
.sum{font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>영어앱 새 주소 시험</h1>
  <p>위에서부터 눌러 주세요. 다 하면 맨 아래 요약만 캡처해서 보내 주세요.</p>

  <section class="t">
    <div class="th"><div><b>1. 마이크 채점</b><small>"Hello, how are you" 라고 말해 보세요. 처음엔 마이크 허용 창이 뜹니다</small></div><span class="chip" id="c-mic">대기</span></div>
    <div class="row"><button class="go" id="b-mic">🎤 말하기</button></div>
    <div class="out" id="o-mic"></div>
  </section>

  <section class="t">
    <div class="th"><div><b>2. 원어민 음성</b><small>영어 문장을 읽어 줍니다</small></div><span class="chip" id="c-voice">대기</span></div>
    <div class="row"><button class="go" id="b-voice">🔊 들어보기</button></div>
    <div class="row" id="a-voice" hidden><button data-k="voice" data-v="1">들렸어요</button><button data-k="voice" data-v="0">안 들렸어요</button></div>
  </section>

  <section class="t">
    <div class="th"><div><b>3. 유튜브 문장 구간 재생</b><small>영상의 한 구간(5초)만 재생하고 멈추는지 봅니다</small></div><span class="chip" id="c-yt">대기</span></div>
    <div class="yt"><div id="player"></div></div>
    <div class="row"><button class="go" id="b-yt" disabled>▶ 구간 재생 (0:10~0:15)</button></div>
    <div class="out" id="o-yt"></div>
    <div class="row" id="a-yt" hidden><button data-k="yt" data-v="1">5초만 나오고 멈췄어요</button><button data-k="yt" data-v="0">안 돼요</button></div>
  </section>

  <div class="sum" id="sum"></div>
</div>

<script>
const R={};
const NAMES={mic:'1 마이크',voice:'2 음성',yt:'3 유튜브 구간'};
function chip(k,ok,note){R[k]={ok,note};const c=document.getElementById('c-'+k);c.className='chip '+(ok?'ok':'no');c.textContent=ok?'✅ 됨':'❌ 안 됨';sum();}
function out(k,t){document.getElementById('o-'+k).textContent=t;}
function sum(){document.getElementById('sum').textContent=Object.keys(NAMES).map(k=>NAMES[k]+' : '+(R[k]?(R[k].ok?'됨':'안 됨')+(R[k].note?' — '+R[k].note:''):'-')).join('\n')+'\n'+navigator.userAgent.replace(/^Mozilla\/5\.0 /,'');}
sum();

document.getElementById('b-mic').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){chip('mic',false,'브라우저에 기능 없음');return;}
  const r=new SR();r.lang='en-US';r.interimResults=false;
  out('mic','듣는 중…');
  r.onresult=e=>{const t=e.results[0][0].transcript;out('mic','들은 말: '+t);chip('mic',true,t);};
  r.onerror=e=>{out('mic','오류: '+e.error);chip('mic',false,e.error);};
  try{r.start();}catch(e){chip('mic',false,e.message);}
};

document.getElementById('b-voice').onclick=()=>{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance("Hello! Let's practice English together.");u.lang='en-US';u.rate=.9;
  speechSynthesis.speak(u);document.getElementById('a-voice').hidden=false;
};

document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>chip(b.dataset.k,b.dataset.v==='1',b.dataset.v==='1'?'':'사용자 확인: 안 됨'));

/* 유튜브 IFrame API: 0:10~0:15 구간만 재생 */
let player=null;
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('player',{width:'100%',height:'100%',videoId:'M7lc1UVf-VE',
    playerVars:{playsinline:1,rel:0},
    events:{onReady:()=>{document.getElementById('b-yt').disabled=false;out('yt','영상 준비됨');},
            onError:e=>{out('yt','영상 오류 코드 '+e.data);chip('yt',false,'오류 '+e.data);}}});
};
document.getElementById('b-yt').onclick=()=>{
  player.loadVideoById({videoId:'M7lc1UVf-VE',startSeconds:10,endSeconds:15});
  out('yt','0:10부터 재생 중… 0:15에 멈춰야 정상');
  document.getElementById('a-yt').hidden=false;
};
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
